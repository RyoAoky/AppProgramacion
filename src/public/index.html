<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Project Orchestrator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1>AI Project Orchestrator Dashboard</h1>

    <div class="card mb-4 mt-4">
      <div class="card-header">Configuración de APIs</div>
      <div class="card-body">
        <form id="configForm">
          <div class="mb-3">
            <label class="form-label" for="AI_API_URL">AI API URL</label>
            <input type="text" class="form-control" id="AI_API_URL">
          </div>
          <div class="mb-3">
            <label class="form-label" for="AI_API_KEY">AI API Key</label>
            <input type="password" class="form-control" id="AI_API_KEY">
          </div>
          <div class="mb-3">
            <label class="form-label" for="AI_MODEL">AI Model</label>
            <input type="text" class="form-control" id="AI_MODEL" value="gpt-4">
          </div>
          <div class="mb-3">
            <label class="form-label" for="OPENPROJECT_API_URL">OpenProject API URL</label>
            <input type="text" class="form-control" id="OPENPROJECT_API_URL">
          </div>
          <div class="mb-3">
            <label class="form-label" for="OPENPROJECT_API_KEY">OpenProject API Key</label>
            <input type="password" class="form-control" id="OPENPROJECT_API_KEY">
          </div>
          <button type="submit" class="btn btn-primary">Guardar y Validar Configuración</button>
        </form>
        <div id="configStatus" class="mt-2 text-success" style="display: none;"></div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Listado de Proyectos</span>
        <button id="refreshProjects" class="btn btn-sm btn-outline-secondary">Refrescar</button>
      </div>
      <div class="card-body">
         <div class="table-responsive">
            <table class="table" id="projectsTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Identificador</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
              </tbody>
            </table>
         </div>
      </div>
    </div>

    <div id="statusBar" class="alert alert-info" style="display: none;">
      <strong>Estado:</strong> <span id="statusMessage">Esperando...</span>
    </div>
  </div>

  <div class="modal fade" id="validationModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Revisión de Propuesta de IA</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <pre id="aiProposalContent" class="bg-light p-3 border rounded"></pre>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-success" id="btnApproveSync">Aprobar y Sincronizar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
